name: agent-loop

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_loop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_loop}
      POSTGRES_DB: ${POSTGRES_DB:-agent_loop}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_loop} -d ${POSTGRES_DB:-agent_loop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-agent_loop}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-agent_loop_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until mc alias set local http://minio:9000 "${MINIO_ACCESS_KEY:-agent_loop}" "${MINIO_SECRET_KEY:-agent_loop_password}"; do
          sleep 2;
        done;
        mc mb --ignore-existing "local/${MINIO_BUCKET:-agent-loop-documents}";
    depends_on:
      minio:
        condition: service_started

  sandbox-service:
    build:
      context: ./sandbox_service
    image: agent-loop-sandbox-service:day10
    environment:
      SANDBOX_SERVICE_TOKEN: ${SANDBOX_SERVICE_TOKEN:-local-sandbox-token-change-me}
      SANDBOX_RUNTIME_IMAGE: ${SANDBOX_RUNTIME_IMAGE:-python:3.13-slim}
      SANDBOX_EXECUTION_TIMEOUT_SECONDS: ${SANDBOX_EXECUTION_TIMEOUT_SECONDS:-5}
      SANDBOX_DOCKER_API_TIMEOUT_SECONDS: ${SANDBOX_DOCKER_API_TIMEOUT_SECONDS:-10}
      SANDBOX_MEMORY_LIMIT: ${SANDBOX_MEMORY_LIMIT:-128m}
      SANDBOX_NANO_CPUS: ${SANDBOX_NANO_CPUS:-500000000}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-64}
      SANDBOX_WORKSPACE_TMPFS_SIZE: ${SANDBOX_WORKSPACE_TMPFS_SIZE:-32m}
      SANDBOX_TEMP_TMPFS_SIZE: ${SANDBOX_TEMP_TMPFS_SIZE:-16m}
      SANDBOX_SHM_SIZE: ${SANDBOX_SHM_SIZE:-16m}
      SANDBOX_MAX_OUTPUT_BYTES: ${SANDBOX_MAX_OUTPUT_BYTES:-65536}
      SANDBOX_MAX_CONCURRENCY: ${SANDBOX_MAX_CONCURRENCY:-2}
      SANDBOX_ALLOWED_ENV_KEYS: ${SANDBOX_ALLOWED_ENV_KEYS:-LANG,LC_ALL,TZ,PYTHONUNBUFFERED}
      SANDBOX_STALE_CONTAINER_TTL_SECONDS: ${SANDBOX_STALE_CONTAINER_TTL_SECONDS:-300}
    expose:
      - "8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://agent_loop:agent_loop@postgres:5432/agent_loop
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_EMBEDDING_QUEUE: ${REDIS_EMBEDDING_QUEUE:-agent_loop:embedding_jobs}
      AGENT_SESSION_MESSAGE_LIMIT: ${AGENT_SESSION_MESSAGE_LIMIT:-12}
      AGENT_SESSION_TTL_SECONDS: ${AGENT_SESSION_TTL_SECONDS:-86400}
      AGENT_RATE_LIMIT_REQUESTS: ${AGENT_RATE_LIMIT_REQUESTS:-60}
      AGENT_RATE_LIMIT_WINDOW_SECONDS: ${AGENT_RATE_LIMIT_WINDOW_SECONDS:-60}
      AGENT_TOKEN_BUDGET: ${AGENT_TOKEN_BUDGET:-12000}
      AGENT_TOOL_MAX_ROUNDS: ${AGENT_TOOL_MAX_ROUNDS:-3}
      AGENT_LLM_TIMEOUT_SECONDS: ${AGENT_LLM_TIMEOUT_SECONDS:-30}
      MEMORY_RETRIEVAL_LIMIT: ${MEMORY_RETRIEVAL_LIMIT:-5}
      MEMORY_CANDIDATE_LIMIT: ${MEMORY_CANDIDATE_LIMIT:-200}
      MEMORY_CONTEXT_MAX_CHARS: ${MEMORY_CONTEXT_MAX_CHARS:-2400}
      MEMORY_CACHE_TTL_SECONDS: ${MEMORY_CACHE_TTL_SECONDS:-300}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/storage/uploads}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-agent_loop}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-agent_loop_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-agent-loop-documents}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_HTTP_BASE_URL: ${DASHSCOPE_HTTP_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.7-max}
      RERANK_MODEL: ${RERANK_MODEL:-qwen3-rerank}
      RERANK_MIN_SCORE: ${RERANK_MIN_SCORE:-0.35}
      RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-15}
      TOOL_DEFAULT_ROLES: ${TOOL_DEFAULT_ROLES:-user}
      TOOL_ROLE_ASSIGNMENTS: '${TOOL_ROLE_ASSIGNMENTS:-{"demo-user":["operator","approver"],"day10-eval-*":["operator","approver"]}}'
      TOOL_WEBHOOK_ALLOWED_HOSTS: ${TOOL_WEBHOOK_ALLOWED_HOSTS:-}
      TOOL_WEBHOOK_TIMEOUT_SECONDS: ${TOOL_WEBHOOK_TIMEOUT_SECONDS:-10}
      TOOL_WEBHOOK_MAX_RESPONSE_BYTES: ${TOOL_WEBHOOK_MAX_RESPONSE_BYTES:-65536}
      SANDBOX_SERVICE_URL: ${SANDBOX_SERVICE_URL:-http://sandbox-service:8080}
      SANDBOX_SERVICE_TOKEN: ${SANDBOX_SERVICE_TOKEN:-local-sandbox-token-change-me}
      SANDBOX_REQUEST_TIMEOUT_SECONDS: ${SANDBOX_REQUEST_TIMEOUT_SECONDS:-10}
      SANDBOX_ALLOWED_ENV_KEYS: ${SANDBOX_ALLOWED_ENV_KEYS:-LANG,LC_ALL,TZ,PYTHONUNBUFFERED}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-10}
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      sandbox-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://agent_loop:agent_loop@postgres:5432/agent_loop
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./worker
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_EMBEDDING_QUEUE: ${REDIS_EMBEDDING_QUEUE:-agent_loop:embedding_jobs}
      DATABASE_URL: postgresql+psycopg://agent_loop:agent_loop@postgres:5432/agent_loop
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.7-max}
      RERANK_MODEL: ${RERANK_MODEL:-qwen3-rerank}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-10}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  frontend-check:
    profiles: ["test"]
    build:
      context: ./frontend
      target: build
    command: ["npm", "run", "build"]
    network_mode: none

  evals:
    profiles: ["test"]
    image: python:3.13-slim
    command: ["python", "/evals/run_evals.py", "--base-url", "http://backend:8000"]
    volumes:
      - ./evals:/evals:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_storage:
