name: agent-loop

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_loop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_loop}
      POSTGRES_DB: ${POSTGRES_DB:-agent_loop}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_loop} -d ${POSTGRES_DB:-agent_loop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-agent_loop}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-agent_loop_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until mc alias set local http://minio:9000 "${MINIO_ACCESS_KEY:-agent_loop}" "${MINIO_SECRET_KEY:-agent_loop_password}"; do
          sleep 2;
        done;
        mc mb --ignore-existing "local/${MINIO_BUCKET:-agent-loop-documents}";
    depends_on:
      minio:
        condition: service_started

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://agent_loop:agent_loop@postgres:5432/agent_loop
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_EMBEDDING_QUEUE: ${REDIS_EMBEDDING_QUEUE:-agent_loop:embedding_jobs}
      AGENT_SESSION_MESSAGE_LIMIT: ${AGENT_SESSION_MESSAGE_LIMIT:-12}
      AGENT_SESSION_TTL_SECONDS: ${AGENT_SESSION_TTL_SECONDS:-86400}
      AGENT_RATE_LIMIT_REQUESTS: ${AGENT_RATE_LIMIT_REQUESTS:-60}
      AGENT_RATE_LIMIT_WINDOW_SECONDS: ${AGENT_RATE_LIMIT_WINDOW_SECONDS:-60}
      AGENT_TOKEN_BUDGET: ${AGENT_TOKEN_BUDGET:-12000}
      AGENT_TOOL_MAX_ROUNDS: ${AGENT_TOOL_MAX_ROUNDS:-3}
      AGENT_LLM_TIMEOUT_SECONDS: ${AGENT_LLM_TIMEOUT_SECONDS:-30}
      MEMORY_RETRIEVAL_LIMIT: ${MEMORY_RETRIEVAL_LIMIT:-5}
      MEMORY_CANDIDATE_LIMIT: ${MEMORY_CANDIDATE_LIMIT:-200}
      MEMORY_CONTEXT_MAX_CHARS: ${MEMORY_CONTEXT_MAX_CHARS:-2400}
      MEMORY_CACHE_TTL_SECONDS: ${MEMORY_CACHE_TTL_SECONDS:-300}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/storage/uploads}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-agent_loop}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-agent_loop_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-agent-loop-documents}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_HTTP_BASE_URL: ${DASHSCOPE_HTTP_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.7-max}
      RERANK_MODEL: ${RERANK_MODEL:-qwen3-rerank}
      RERANK_MIN_SCORE: ${RERANK_MIN_SCORE:-0.35}
      RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-15}
      TOOL_DEFAULT_ROLES: ${TOOL_DEFAULT_ROLES:-user}
      TOOL_ROLE_ASSIGNMENTS: '${TOOL_ROLE_ASSIGNMENTS:-{"demo-user":["operator","approver"]}}'
      TOOL_WEBHOOK_ALLOWED_HOSTS: ${TOOL_WEBHOOK_ALLOWED_HOSTS:-}
      TOOL_WEBHOOK_TIMEOUT_SECONDS: ${TOOL_WEBHOOK_TIMEOUT_SECONDS:-10}
      TOOL_WEBHOOK_MAX_RESPONSE_BYTES: ${TOOL_WEBHOOK_MAX_RESPONSE_BYTES:-65536}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-10}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - backend_storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://agent_loop:agent_loop@postgres:5432/agent_loop
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini:ro
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./worker
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_EMBEDDING_QUEUE: ${REDIS_EMBEDDING_QUEUE:-agent_loop:embedding_jobs}
      DATABASE_URL: postgresql+psycopg://agent_loop:agent_loop@postgres:5432/agent_loop
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.7-max}
      RERANK_MODEL: ${RERANK_MODEL:-qwen3-rerank}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-10}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_storage:
